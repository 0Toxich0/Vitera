<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Vitera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0a0f1e;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            color: #ffffff;
        }
        .error-content {
            text-align: center;
            background: rgba(18, 25, 45, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 3rem 2rem;
            border: 1px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.5);
        }
        .error-content h1 {
            font-size: 7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(168,85,247,0.4);
        }
        .error-content h2 {
            color: #f8fafc;
            font-weight: 600;
        }
        .error-content p {
            color: #cbd5e1;
            font-size: 1.2rem;
        }
        .btn-primary {
            background: linear-gradient(95deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 60px;
            padding: 12px 32px;
            font-weight: 600;
            color: white;
            transition: 0.2s;
        }
        .btn-primary:hover {
            transform: scale(0.96);
            box-shadow: 0 8px 20px rgba(139,92,246,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="error-content">
                    <h1>404</h1>
                    <h2>Страница не найдена</h2>
                    <p class="mt-3">Возможно, вы перешли по неверной ссылке или страница была удалена.</p>
                    <a href="index.html" class="btn btn-primary mt-3"><i class="fas fa-arrow-left me-2"></i>На главную</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
