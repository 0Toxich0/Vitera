<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты — Vitera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: #0a0f1e;
            font-family: 'Inter', system-ui, sans-serif;
            padding-top: 40px;
            padding-bottom: 40px;
            color: #ffffff;
        }
        .contact-card {
            background: rgba(18, 25, 45, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            padding: 2rem;
            height: 100%;
            transition: 0.2s;
        }
        .contact-card h3 {
            color: #f1f5f9;
            margin-bottom: 1.2rem;
            font-weight: 600;
        }
        .contact-card h3 i {
            background: linear-gradient(135deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-right: 10px;
        }
        .form-control {
            background: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 60px;
            padding: 12px 20px;
        }
        .form-control:focus {
            background: #0f172a;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 2px rgba(139,92,246,0.4);
            color: white;
        }
        .form-control::placeholder {
            color: #94a3b8;
        }
        textarea.form-control {
            border-radius: 24px;
        }
        .btn-primary {
            background: linear-gradient(95deg, #3b82f6, #8b5cf6);
            border: none;
            border-radius: 60px;
            padding: 12px 24px;
            font-weight: 600;
            color: white;
        }
        .btn-primary:hover {
            transform: scale(0.96);
            box-shadow: 0 8px 20px rgba(139,92,246,0.5);
        }
        .map-container {
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid rgba(139,92,246,0.5);
        }
        .contact-info p {
            color: #cbd5e1;
            margin-top: 1rem;
            font-size: 1rem;
        }
        .contact-info i {
            width: 30px;
            color: #a855f7;
        }
        .btn-outline-secondary {
            border-radius: 60px;
            border-color: #475569;
            color: #e2e8f0;
            padding: 10px 24px;
            background: transparent;
        }
        .btn-outline-secondary:hover {
            background: #334155;
            color: white;
            border-color: #8b5cf6;
        }
        .alert-success {
            background: #10b98120;
            border: 1px solid #10b981;
            color: #a7f3d0;
            border-radius: 60px;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <div class="row g-4">
            <div class="col-md-6">
                <div class="contact-card">
                    <h3><i class="fas fa-envelope"></i> Напишите нам</h3>
                    <form id="contactForm">
                        <div class="mb-3">
                            <input type="text" class="form-control" placeholder="Ваше имя" required>
                        </div>
                        <div class="mb-3">
                            <input type="email" class="form-control" placeholder="Email" required>
                        </div>
                        <div class="mb-3">
                            <textarea class="form-control" rows="4" placeholder="Сообщение" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Отправить <i class="fas fa-paper-plane ms-2"></i></button>
                    </form>
                    <div id="contactMsg" class="mt-3"></div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="contact-card">
                    <h3><i class="fas fa-map-marker-alt"></i> Мы здесь</h3>
                    <div class="map-container mb-3">
                        <iframe src="https://yandex.ru/map-widget/v1/?ll=37.617698,55.755864&z=12" allowfullscreen style="width:100%; height:250px; border:0;"></iframe>
                    </div>
                    <div class="contact-info">
                        <p><i class="fas fa-phone"></i> +7 (495) 123-45-67</p>
                        <p><i class="fas fa-envelope"></i> hello@vitera.ru</p>
                        <p><i class="fas fa-clock"></i> Ежедневно 10:00 – 20:00</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="text-center mt-5">
            <a href="index.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-left me-2"></i>Вернуться на главную</a>
        </div>
    </div>
    <script>
        document.getElementById('contactForm')?.addEventListener('submit', (e) => {
            e.preventDefault();
            document.getElementById('contactMsg').innerHTML = '<div class="alert alert-success text-center">Спасибо! Мы ответим вам в ближайшее время.</div>';
            e.target.reset();
        });
    </script>
</body>
</html>
